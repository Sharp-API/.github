name: Validate profile

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'mergify/merge-queue/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: validate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: 'profile/**/*.md'
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml 'profile/**/*.md'
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          # Check public accessibility, including for links to private GitHub repos.
          token: ''
